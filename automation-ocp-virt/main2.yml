- hosts: localhost  
  connection: local
  tasks:
  - ansible.builtin.shell: "{{ k8s-login }}"
  - name: Create project
    redhat.openshift.k8s:
      api_key: "{{ K8S_AUTH_API_KEY }}"
      host: "{{ K8S_HOST }}"
      validate_certs: false
      state: present
      definition:
        apiVersion: project.openshift.io/v1
        kind: Project
        metadata:
          name: workloads
